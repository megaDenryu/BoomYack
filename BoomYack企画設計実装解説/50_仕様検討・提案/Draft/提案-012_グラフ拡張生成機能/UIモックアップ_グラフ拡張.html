<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoomYack - AI グラフ拡張生成プロトタイプ</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --text-main: #0f172a;
            --text-dim: #475569;
            --border-color: rgba(148, 163, 184, 0.3);
            --glass-blur: blur(12px);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* キャンバス背景（グリッド） */
        .canvas {
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            position: relative;
            cursor: grab;
        }

        /* SVGレイヤー（接続線） */
        .connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ノード共通スタイル */
        .node {
            position: absolute;
            width: 200px;
            padding: 16px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .node:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .node.selected {
            border: 2px solid var(--accent-primary);
            transform: scale(1.02);
        }

        .node-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .node-content {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* AIボタン（フローティング） */
        .ai-action-button {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            opacity: 0;
            transition: all 0.2s;
            z-index: 10;
        }

        .selected .ai-action-button {
            opacity: 1;
            right: -50px;
        }

        .ai-action-button:hover {
            transform: translateY(-50%) scale(1.1);
            filter: brightness(1.2);
        }

        /* ローディングアニメーション */
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 仮配置（Draft）ノード */
        .node.draft {
            border: 2px dashed var(--accent-primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15), inset 0 0 10px rgba(139, 92, 246, 0.05);
            opacity: 0.8;
            animation: fadeIn 0.5s ease-out forwards, pulseGlow 2s infinite;
            background: rgba(255, 255, 255, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.8; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.15), inset 0 0 10px rgba(139, 92, 246, 0.05); }
            50% { box-shadow: 0 0 25px rgba(139, 92, 246, 0.4), inset 0 0 15px rgba(139, 92, 246, 0.1); }
            100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.15), inset 0 0 10px rgba(139, 92, 246, 0.05); }
        }

        /* フローティングバー（承認/却下） */
        .review-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--accent-primary);
            padding: 12px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .review-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border-color: var(--border-color);
        }

        .btn-ghost:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        /* インストラクション */
        .overlay-instruction {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
            pointer-events: none;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            background: white;
            border-radius: 50%;
            animation: particleAnim 1s ease-out forwards;
        }

        @keyframes particleAnim {
            to { transform: translate(var(--x), var(--y)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="overlay-instruction">
        ノードをクリックして選択し、✨ボタンを押してください
    </div>

    <div class="canvas" id="canvas">
        <svg class="connections" id="svg-layer"></svg>

        <!-- 起点ノード -->
        <div class="node" id="root-node" style="left: 400px; top: 300px;">
            <div class="node-title">グラフ拡張生成機能</div>
            <div class="node-content">
                このノードから新しいアイデアを展開してみましょう。
            </div>
            <button class="ai-action-button" id="expand-btn">
                <span id="btn-icon">✨</span>
            </button>
        </div>
    </div>

    <!-- UIレビューバー -->
    <div class="review-bar" id="review-bar">
        <span style="font-size: 0.9rem; color: var(--text-main);">AIが3つの提案を生成しました</span>
        <button class="btn btn-ghost" onclick="reset()">再生成</button>
        <button class="btn btn-danger" onclick="reject()">破棄</button>
        <button class="btn btn-primary" onclick="accept()">全て採用 (Accept)</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const rootNode = document.getElementById('root-node');
        const expandBtn = document.getElementById('expand-btn');
        const reviewBar = document.getElementById('review-bar');
        const svgLayer = document.getElementById('svg-layer');
        const btnIcon = document.getElementById('btn-icon');

        let isGenerating = false;
        let draftNodes = [];

        // ノード選択
        rootNode.addEventListener('click', (e) => {
            e.stopPropagation();
            rootNode.classList.toggle('selected');
        });

        canvas.addEventListener('click', () => {
            rootNode.classList.remove('selected');
        });

        // 拡張実行
        expandBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (isGenerating) return;

            isGenerating = true;
            btnIcon.innerHTML = '<div class="loader"></div>';

            // パーティクル演出
            createParticles(e.clientX, e.clientY);

            // 擬似的なネットワーク待ち
            await new Promise(r => setTimeout(r, 1500));

            generateDrafts();

            isGenerating = false;
            btnIcon.innerHTML = '✨';
            reviewBar.classList.add('active');
        });

        function generateDrafts() {
            const suggestions = [
                { title: "UI/UX 設計", content: "半透明のドラフト表示と承認フローを実装します。" },
                { title: "LLM プロンプト", content: "文脈を維持しつつJSON形式で出力させる指示を設計。" },
                { title: "自動レイアウト", content: "新しく追加されたノードが重ならないよう座標を計算。" }
            ];

            const startX = 400;
            const startY = 300;

            suggestions.forEach((s, i) => {
                const node = document.createElement('div');
                node.className = 'node draft';
                const x = startX + 300;
                const y = startY + (i - 1) * 150;
                
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                node.innerHTML = `
                    <div class="node-title">${s.title}</div>
                    <div class="node-content">${s.content}</div>
                `;
                
                canvas.appendChild(node);
                draftNodes.push(node);
                drawConnection(startX + 200, startY + 50, x, y + 50);
            });
        }

        function drawConnection(x1, y1, x2, y2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const dx = (x2 - x1) / 2;
            const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
            
            line.setAttribute('d', d);
            line.setAttribute('stroke', 'rgba(139, 92, 246, 0.4)');
            line.setAttribute('stroke-width', '2');
            line.setAttribute('fill', 'none');
            line.setAttribute('stroke-dasharray', '4');
            line.style.transition = 'all 0.5s';
            
            svgLayer.appendChild(line);
        }

        function createParticles(x, y) {
            for(let i=0; i<10; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = p.style.height = Math.random() * 6 + 2 + 'px';
                p.style.background = `hsl(${260 + Math.random() * 40}, 80%, 70%)`;
                p.style.setProperty('--x', (Math.random() - 0.5) * 100 + 'px');
                p.style.setProperty('--y', (Math.random() - 0.5) * 100 + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        // ボタンアクション
        function accept() {
            draftNodes.forEach(n => {
                n.classList.remove('draft');
                n.style.opacity = '1';
                n.style.borderStyle = 'solid';
            });
            Array.from(svgLayer.children).forEach(l => {
                l.setAttribute('stroke-dasharray', '0');
                l.setAttribute('stroke', 'rgba(139, 92, 246, 0.8)');
            });
            reviewBar.classList.remove('active');
        }

        function reject() {
            draftNodes.forEach(n => n.remove());
            svgLayer.innerHTML = '';
            draftNodes = [];
            reviewBar.classList.remove('active');
        }

        function reset() {
            reject();
            setTimeout(() => expandBtn.click(), 300);
        }
    </script>
</body>
</html>
