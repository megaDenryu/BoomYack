name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: core typecheck
        run: npx tsc --noEmit
        working-directory: packages/core
      - name: core contract tests
        run: npm test
        working-directory: packages/core
      - name: mcp typecheck
        run: npx tsc --noEmit
        working-directory: packages/mcp
